---
# Scenario: check-mode run where a change would be required.
#
# Precondition: VLAN 300 must not already exist with name STAGING (either
# absent entirely, or present with a different name).
#
# Run with --check together with --extra-vars @check_mode_change_required.yml
#
# Expected behavior:
#   - No configuration change is made to the device.
#   - status: changed (predicted), execution_mode: check,
#     verification: not_attempted.
#   - capability_result.outcome is intentionally omitted for a predicted
#     change - see the Check Mode section of vlan.md.

vlan_id: 300
vlan_name: STAGING
vlan_action: create
