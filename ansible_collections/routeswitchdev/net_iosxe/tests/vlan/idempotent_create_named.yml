---
# Scenario: idempotency for a named VLAN create.
#
# This is a two-run test against the same host with the same extra-vars:
#   1. First run converges the device: VLAN 201 is created or renamed to
#      ENGINEERING, whichever is required (status: changed, outcome:
#      provisioned or remediated).
#   2. Second run is the actual test point. It must report:
#        - no configuration change
#        - status: ok
#        - changed: false
#        - verification: passed
#        - outcome: compliant

vlan_id: 201
vlan_name: ENGINEERING
vlan_action: create
