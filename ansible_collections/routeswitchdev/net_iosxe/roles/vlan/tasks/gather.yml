---
# net_iosxe/vlan: gather current device state.
#
# Only VLAN state is gathered here. Interface, trunk, and SVI state are
# outside the scope of the currently supported actions.

- name: "vlan: gather current VLAN configuration"
  cisco.ios.ios_vlans:
    state: gathered
  register: vlan_gathered_result
  until: vlan_gathered_result is succeeded
  retries: 2
  delay: 10

- name: "vlan: find matching VLAN entries for the requested vlan_id"
  ansible.builtin.set_fact:
    vlan_matches: >-
      {{
        vlan_gathered_result.gathered
        | selectattr('vlan_id', 'equalto', vlan_id)
        | list
      }}

- name: "vlan: set current VLAN entry when it exists"
  ansible.builtin.set_fact:
    vlan_current: "{{ vlan_matches[0] }}"
  when: vlan_matches | length > 0

- name: "vlan: set current VLAN entry to none when it does not exist"
  ansible.builtin.set_fact:
    vlan_current: ~
  when: vlan_matches | length == 0