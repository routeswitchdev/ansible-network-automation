---

# 1. If capability_result is not returned, then FAIL
- name: "net_common-contract: Ensure capability_result is defined"
  ansible.builtin.fail:
    msg: "capability_result is required."
  when: capability_result is not defined


# 2. If capability_result is returned but is not a dict/mapping, then FAIL
- name: "net_common-contract: Ensure capability_result is a mapping"
  ansible.builtin.fail:
    msg: >-
      capability_result must be a mapping (dict);
      got {{ capability_result | type_debug }}.
  when:
    - capability_result is defined
    - capability_result is not mapping


# 3. If required keys are missing from capability_result, then FAIL
- name: "net_common-contract: Ensure every required key is present"
  ansible.builtin.fail:
    msg: >-
      capability_result is missing required key(s):
      {{
        capability_result_required_keys
        | difference(capability_result.keys() | list)
        | join(', ')
      }}.
  when:
    - capability_result is defined
    - capability_result is mapping
    - >-
      (
        capability_result_required_keys
        | difference(capability_result.keys() | list)
        | length
      ) > 0


# 4. If capability_result contains unrecognized keys, then FAIL
- name: "net_common-contract: Reject unknown keys"
  ansible.builtin.fail:
    msg: >-
      capability_result has unrecognized key(s):
      {{
        (capability_result.keys() | list)
        | difference(
            capability_result_required_keys
            + capability_result_optional_keys
          )
        | join(', ')
      }}.
  when:
    - capability_result is defined
    - capability_result is mapping
    - >-
      (
        (capability_result.keys() | list)
        | difference(
            capability_result_required_keys
            + capability_result_optional_keys
          )
        | length
      ) > 0


# 5. If capability_result status is missing or invalid, then FAIL
- name: "net_common-contract: Ensure status is one of the allowed values"
  ansible.builtin.fail:
    msg: >-
      capability_result.status '{{ capability_result.status | default("undefined") }}'
      must be one of: {{ common_status_allowed_values | join(', ') }}.
  when:
    - capability_result is defined
    - capability_result is mapping
    - >-
      (capability_result.status is not defined)
      or
      (capability_result.status not in common_status_allowed_values)


# 6. If capability_result execution_mode is missing or invalid, then FAIL
- name: "net_common-contract: Ensure execution_mode is one of the allowed values"
  ansible.builtin.fail:
    msg: >-
      capability_result.execution_mode
      '{{ capability_result.execution_mode | default("undefined") }}'
      must be one of:
      {{ common_execution_mode_allowed_values | join(', ') }}.
  when:
    - capability_result is defined
    - capability_result is mapping
    - >-
      (capability_result.execution_mode is not defined)
      or
      (
        capability_result.execution_mode
        not in common_execution_mode_allowed_values
      )


# 7. If capability_result verification is missing or invalid, then FAIL
- name: "net_common-contract: Ensure verification is one of the allowed values"
  ansible.builtin.fail:
    msg: >-
      capability_result.verification
      '{{ capability_result.verification | default("undefined") }}'
      must be one of:
      {{ common_verification_allowed_values | join(', ') }}.
  when:
    - capability_result is defined
    - capability_result is mapping
    - >-
      (capability_result.verification is not defined)
      or
      (
        capability_result.verification
        not in common_verification_allowed_values
      )


# 8. If host or capability is missing or is not a non-empty string, then FAIL
- name: "net_common-contract: Ensure required string fields are valid"
  ansible.builtin.fail:
    msg: "capability_result.{{ item }} must be defined as a non-empty string."
  loop:
    - host
    - capability
  when:
    - capability_result is defined
    - capability_result is mapping
    - >-
      (capability_result[item] is not defined)
      or
      (capability_result[item] is not string)
      or
      (capability_result[item] | default('') | length == 0)


# 9. If timestamp is missing, is not a string, is empty, or has an invalid format, then FAIL
- name: "net_common-contract: Ensure timestamp is valid"
  ansible.builtin.fail:
    msg: >-
      capability_result.timestamp must be a valid UTC timestamp
      in the format YYYY-MM-DDTHH:MM:SSZ.
  when:
    - capability_result is defined
    - capability_result is mapping
    - >-
      (capability_result.timestamp is not defined)
      or
      (capability_result.timestamp is not string)
      or
      (capability_result.timestamp | default('') | length == 0)
      or
      (
        capability_result.timestamp
        | default('')
        | regex_search(
            '^[0-9]{4}-(0[1-9]|1[0-2])-([0-2][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$'
          )
        is none
      )


# 10. If requested_action or outcome is provided but is not a non-empty string, then FAIL
- name: "net_common-contract: Ensure optional string fields are valid"
  ansible.builtin.fail:
    msg: "capability_result.{{ item }} must be a non-empty string when provided."
  loop:
    - requested_action
    - outcome
  when:
    - capability_result is defined
    - capability_result is mapping
    - capability_result[item] is defined
    - >-
      (capability_result[item] is not string)
      or
      (capability_result[item] | length == 0)
     

# 11. If warnings or errors is missing or is not a list, then FAIL
- name: "net_common-contract: Ensure warnings and errors are lists"
  ansible.builtin.fail:
    msg: "capability_result.{{ item }} must be defined as a list."
  loop:
    - warnings
    - errors
  when:
    - capability_result is defined
    - capability_result is mapping
    - >-
      (capability_result[item] is not defined)
      or
      (capability_result[item] | default([]) | type_debug != 'list')
      

# 12. If warnings contains a non-string item, then FAIL
- name: "net_common-contract: Ensure warnings contain only strings"
  ansible.builtin.fail:
    msg: >-
      capability_result.warnings must contain only strings;
      got {{ item | type_debug }}.
  loop: "{{ capability_result.warnings | default([]) }}"
  when:
    - capability_result is defined
    - capability_result is mapping
    - capability_result.warnings is defined
    - capability_result.warnings | type_debug == 'list'
    - item is not string


# 13. If errors contains a non-string item, then FAIL
- name: "net_common-contract: Ensure errors contain only strings"
  ansible.builtin.fail:
    msg: >-
      capability_result.errors must contain only strings;
      got {{ item | type_debug }}.
  loop: "{{ capability_result.errors | default([]) }}"
  when:
    - capability_result is defined
    - capability_result is mapping
    - capability_result.errors is defined
    - capability_result.errors | type_debug == 'list'
    - item is not string

# 14. If previous_state or resulting_state is provided but is not a dict/mapping, then FAIL
- name: "net_common-contract: Ensure optional state fields are mappings"
  ansible.builtin.fail:
    msg: "capability_result.{{ item }} must be a mapping (dict) when provided."
  loop:
    - previous_state
    - resulting_state
  when:
    - capability_result is defined
    - capability_result is mapping
    - capability_result[item] is defined
    - capability_result[item] is not mapping