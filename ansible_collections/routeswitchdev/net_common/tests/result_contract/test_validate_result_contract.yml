---
# Independent tests for net_common/roles/result_contract/tasks/validate_result_contract.yml.
#
# These tests run entirely on localhost and make no device connections.
#
# Test strategy:
#   - Positive cases must be accepted by the validator.
#   - Negative cases must be rejected by the validator.
#   - Validation failures are captured with block/rescue.
#   - ansible.builtin.assert determines whether each test actually passed.
#
# From collection root, run with:
#
#   ansible-playbook tests/result_contract/test_validate_result_contract.yml


# =============================================================================
# TEST 01
#
# capability_result must be defined.
#
# This is intentionally a separate first play. capability_result is never
# declared before validation runs, ensuring the variable is genuinely undefined.
# =============================================================================

- name: "TEST 01: Undefined capability_result is rejected"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../roles/result_contract/vars/main.yml

  tasks:

    - name: Initialize test result
      ansible.builtin.set_fact:
        contract_validation_rejected: false
        contract_validation_error: ""

    - name: Attempt contract validation
      block:

        - name: Run contract validation
          ansible.builtin.include_tasks:
            file: ../../roles/result_contract/tasks/validate_result_contract.yml

      rescue:

        - name: Record validation rejection
          ansible.builtin.set_fact:
            contract_validation_rejected: true
            contract_validation_error: >-
              {{
                ansible_failed_result.msg
                | default('Validation failed')
              }}

    - name: "PASS/FAIL: Undefined capability_result must be rejected"
      ansible.builtin.assert:
        that:
          - contract_validation_rejected | bool
        fail_msg: >-
          TEST 01 FAILED: capability_result was undefined, but contract
          validation accepted it.
        success_msg: >-
          TEST 01 PASSED: Undefined capability_result was correctly rejected.


# =============================================================================
# Remaining contract tests
# =============================================================================

