          rescue:

            - name: Record validation rejection
              ansible.builtin.set_fact:
                contract_validation_rejected: true
                contract_validation_error: >-
                  {{
                    ansible_failed_result.msg
                    | default('Validation failed')
                  }}

        - name: "PASS/FAIL: Minimal valid result must be accepted"
          ansible.builtin.assert:
            that:
              - not (contract_validation_rejected | bool)
            fail_msg: >-
              TEST 00A FAILED: A valid minimal capability_result was rejected.
              Validation error: {{ contract_validation_error }}
            success_msg: >-
              TEST 00A PASSED: Minimal valid capability_result was accepted.


    # -------------------------------------------------------------------------
    # TEST 00B
    #
    # Fully populated valid capability_result should pass.
    # -------------------------------------------------------------------------

